name: Package Firefox extension

on:
  push:
    branches:
      - firefox-edge-read-aloud

jobs:
  package:
    if: github.event.head_commit.message != 'Remove temporary packaging workflow'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build XPI
        run: |
          zip -r read-aloud-firefox-1.81.2.xpi _locales css img js sound *.html manifest.json
          unzip -t read-aloud-firefox-1.81.2.xpi
      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: read-aloud-firefox-1.81.2
          path: read-aloud-firefox-1.81.2.xpi
          if-no-files-found: error
