name: Build Firefox XPI 1.81.13 exact mapping

on:
  push:
    branches:
      - firefox-edge-read-aloud
    paths:
      - .github/workflows/build-firefox-18113b.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: firefox-edge-read-aloud

      - name: Apply 1.81.13 source fix
        run: python3 .github/scripts/fix18113_exact.py

      - name: Validate source
        shell: bash
        run: |
          python3 -m py_compile .github/scripts/fix18113_exact.py
          node --check js/firefox-chatgpt.js
          node --check js/firefox-chatgpt-background.js
          node --check js/firefox-page.js
          test "$(jq -r .version manifest.json)" = "1.81.13"
          grep -q 'domToSource: aligned.bToA' js/firefox-chatgpt.js
          grep -q 'sourceToDom: aligned.aToB' js/firefox-chatgpt.js
          grep -q 'chatgptSourceTokenIndex' js/firefox-chatgpt.js
          grep -q 'chatgptSourceTokenIndex' js/firefox-chatgpt-background.js
          if grep -q 'anchor.chatgptTokenIndex' js/firefox-chatgpt-background.js; then
            echo 'Legacy DOM ordinal resolver remains' >&2
            exit 1
          fi
          if grep -q 'sourceOffsetForTurnToken' js/firefox-chatgpt.js; then
            echo 'Legacy direct DOM ordinal mapping remains' >&2
            exit 1
          fi
          if grep -RIn --include='*.js' 'innerHTML[[:space:]]*=' js | grep -v 'jquery'; then
            echo 'First-party innerHTML assignment reintroduced' >&2
            exit 1
          fi

      - name: Commit 1.81.13 source changes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/firefox-chatgpt.js js/firefox-chatgpt-background.js manifest.json
          git commit -m 'Fix ChatGPT click-to-source token mapping in Firefox'
          git push origin HEAD:firefox-edge-read-aloud

      - name: Build Firefox XPI
        shell: bash
        run: |
          mkdir -p build
          zip -r build/read-aloud-firefox-1.81.13.xpi _locales css icons img js sound *.html manifest.json
          unzip -t build/read-aloud-firefox-1.81.13.xpi
          test "$(unzip -p build/read-aloud-firefox-1.81.13.xpi manifest.json | jq -r .version)" = "1.81.13"

      - name: Upload Firefox XPI
        uses: actions/upload-artifact@v4
        with:
          name: read-aloud-firefox-1.81.13
          path: build/read-aloud-firefox-1.81.13.xpi
          if-no-files-found: error
          compression-level: 0
