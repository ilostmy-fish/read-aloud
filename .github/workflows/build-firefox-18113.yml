name: Build Firefox XPI 1.81.13

on:
  push:
    branches:
      - firefox-edge-read-aloud

permissions:
  contents: write

jobs:
  build:
    if: github.event.head_commit.message != 'Fix ChatGPT click-to-source alignment'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: firefox-edge-read-aloud

      - name: Apply ChatGPT click-to-source alignment fix
        run: python3 .github/scripts/fix18113.py

      - name: Validate source
        shell: bash
        run: |
          node --check js/firefox-chatgpt.js
          node --check js/firefox-chatgpt-background.js
          node --check js/firefox-page.js
          test "$(jq -r .version manifest.json)" = "1.81.13"
          grep -q 'domToSource' js/firefox-chatgpt.js
          grep -q 'chatgptSourceTokenIndex' js/firefox-chatgpt.js
          grep -q 'chatgptSourceTokenIndex' js/firefox-chatgpt-background.js
          grep -q 'sourceToDom' js/firefox-chatgpt.js
          if grep -RIn --include='*.js' 'innerHTML[[:space:]]*=' js | grep -v 'jquery'; then
            echo 'First-party innerHTML assignment reintroduced'
            exit 1
          fi

      - name: Commit 1.81.13 source changes
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add js/firefox-chatgpt.js js/firefox-chatgpt-background.js manifest.json
          git commit -m 'Fix ChatGPT click-to-source alignment'
          git push origin HEAD:firefox-edge-read-aloud

      - name: Build Firefox XPI
        shell: bash
        run: |
          mkdir -p build
          zip -r build/read-aloud-firefox-1.81.13.xpi _locales css icons img js sound *.html manifest.json
          unzip -t build/read-aloud-firefox-1.81.13.xpi
          unzip -p build/read-aloud-firefox-1.81.13.xpi manifest.json | jq -e '.version == "1.81.13"'

      - name: Upload Firefox XPI
        uses: actions/upload-artifact@v4
        with:
          name: read-aloud-firefox-1.81.13
          path: build/read-aloud-firefox-1.81.13.xpi
          if-no-files-found: error
          compression-level: 0
