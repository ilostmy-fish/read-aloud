name: Build Firefox XPI 1.81.12

on:
  push:
    branches:
      - firefox-edge-read-aloud

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Remove first-party innerHTML assignments and bump version
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          events = Path('js/events.js')
          text = events.read_text()
          old1 = '"elem.innerHTML = \'Please click the blue SPEAK-IT button, then check the I-AM-NOT-A-ROBOT checkbox.\'"'
          new1 = '"elem.textContent = \'Please click the blue SPEAK-IT button, then check the I-AM-NOT-A-ROBOT checkbox.\'"'
          old2 = '"elem.innerHTML = \'Successful, you can now use Google Wavenet voices. You may close this tab.\'"'
          new2 = '"elem.textContent = \'Successful, you can now use Google Wavenet voices. You may close this tab.\'"'
          if old1 not in text or old2 not in text:
              raise SystemExit('Expected events.js innerHTML assignments were not found')
          events.write_text(text.replace(old1, new1).replace(old2, new2))

          piper = Path('js/piper.js')
          text = piper.read_text()
          old = '''const ugaDialog = document.createElement("DIV")
          ugaDialog.innerHTML = `
            <div class="alert alert-warning text-center">
              Read Aloud uses this tab to synthesize Piper voices. It will close automatically after 15 minutes of inactivity.
            </div>
          `
          document.body.prepend(ugaDialog)'''
          new = '''const ugaDialog = document.createElement("DIV")
          const ugaNotice = document.createElement("DIV")
          ugaNotice.className = "alert alert-warning text-center"
          ugaNotice.textContent = "Read Aloud uses this tab to synthesize Piper voices. It will close automatically after 15 minutes of inactivity."
          ugaDialog.appendChild(ugaNotice)
          document.body.prepend(ugaDialog)'''
          if old not in text:
              raise SystemExit('Expected piper.js innerHTML block was not found')
          piper.write_text(text.replace(old, new))

          supertonic = Path('js/supertonic.js')
          text = supertonic.read_text()
          old = '''  const ugaDialog = document.createElement("DIV")
            ugaDialog.innerHTML = `
              <div class="alert alert-warning text-center">
                Read Aloud uses this tab to synthesize Supertonic voices. It will close automatically after 15 minutes of inactivity.
              </div>
            `
            document.body.prepend(ugaDialog)'''
          # Preserve the existing two-space indentation exactly.
          old = old.replace('    ugaDialog.innerHTML', '  ugaDialog.innerHTML').replace('      <div', '    <div').replace('        Read Aloud', '      Read Aloud').replace('      </div>', '    </div>').replace('    `', '  `').replace('    document.body', '  document.body')
          new = '''  const ugaDialog = document.createElement("DIV")
            const ugaNotice = document.createElement("DIV")
            ugaNotice.className = "alert alert-warning text-center"
            ugaNotice.textContent = "Read Aloud uses this tab to synthesize Supertonic voices. It will close automatically after 15 minutes of inactivity."
            ugaDialog.appendChild(ugaNotice)
            document.body.prepend(ugaDialog)'''
          new = new.replace('    const ugaNotice', '  const ugaNotice').replace('    ugaNotice.className', '  ugaNotice.className').replace('    ugaNotice.textContent', '  ugaNotice.textContent').replace('    ugaDialog.appendChild', '  ugaDialog.appendChild').replace('    document.body', '  document.body')
          if old not in text:
              raise SystemExit('Expected supertonic.js innerHTML block was not found')
          supertonic.write_text(text.replace(old, new))

          manifest = Path('manifest.json')
          text = manifest.read_text()
          if '"version": "1.81.11"' not in text:
              raise SystemExit('Expected manifest version 1.81.11 was not found')
          manifest.write_text(text.replace('"version": "1.81.11"', '"version": "1.81.12"', 1))
          PY

      - name: Validate source
        shell: bash
        run: |
          test "$(jq -r .version manifest.json)" = "1.81.12"
          node --check js/events.js
          node --check js/piper.js
          node --check js/supertonic.js
          if grep -RIn --include='*.js' --exclude='jquery-3.7.1.min.js' 'innerHTML' js; then
            echo 'First-party innerHTML assignment remains'
            exit 1
          fi

      - name: Commit 1.81.12 source changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/events.js js/piper.js js/supertonic.js manifest.json
          git diff --cached --check
          git commit -m "Remove unsafe innerHTML assignments and bump to 1.81.12"
          git push

      - name: Build Firefox XPI
        shell: bash
        run: |
          mkdir -p build
          zip -r build/read-aloud-firefox-1.81.12.xpi _locales css icons img js sound *.html manifest.json
          unzip -t build/read-aloud-firefox-1.81.12.xpi
          test "$(unzip -p build/read-aloud-firefox-1.81.12.xpi manifest.json | jq -r .version)" = "1.81.12"

      - name: Upload Firefox XPI
        uses: actions/upload-artifact@v4
        with:
          name: read-aloud-firefox-1.81.12
          path: build/read-aloud-firefox-1.81.12.xpi
          if-no-files-found: error
          compression-level: 0
